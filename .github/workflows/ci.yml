name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pr-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:password@localhost:5432/outline_test
  REDIS_URL: redis://127.0.0.1:6379
  URL: http://localhost:3000
  NODE_OPTIONS: --max-old-space-size=8192
  SECRET_KEY: F0E5AD933D7F6FD8F4DBB3E038C501C052DC0593C686D21ACB30AE205D2F634B
  UTILS_SECRET: 123456
  SLACK_VERIFICATION_TOKEN: 123456
  SMTP_USERNAME: localhost

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "yarn"
      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'patches/**') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: yarn install --immutable

  lint:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "yarn"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'patches/**') }}
      - run: yarn lint --quiet

  types:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "yarn"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'patches/**') }}
      - run: yarn tsc

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      server: ${{ steps.scope.outputs.server }}
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scope and gate policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select checks conservatively
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python3 .github/scripts/ci.py plan

  test:
    needs: [setup, changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        test-group: [app, shared]
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "yarn"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'patches/**') }}
      - run: yarn test:${{ matrix.test-group }} --maxWorkers=2

  test-server:
    needs: [setup, changes]
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:14.2
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: outline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "yarn"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'patches/**') }}
      - run: yarn sequelize db:migrate
      - name: Run server tests
        run: yarn test:server --maxWorkers=2 --shard=${{ matrix.shard }}/4

  bundle-size:
    needs: [setup, types, changes]
    if: ${{ needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: "yarn"
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', 'patches/**') }}
      - name: Set environment to production
        run: echo "NODE_ENV=production" >> "$GITHUB_ENV"
      - run: yarn build
      - name: Send bundle stats to RelativeCI
        if: github.repository == 'outline/outline'
        uses: relative-ci/agent-action@v2
        with:
          key: ${{ secrets.RELATIVE_CI_KEY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          webpackStatsFile: ./build/app/webpack-stats.json

  check:
    name: PR checks
    needs: [setup, changes, lint, types, test, test-server, bundle-size]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all planned checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ['RESULTS'])
          for name in ['setup', 'changes', 'lint', 'types']:
              assert jobs[name]['result'] == 'success', name
          for name, scope in [('test', 'app'), ('test-server', 'server'), ('bundle-size', 'run')]:
              planned = jobs['changes']['outputs'][scope]
              assert planned in ('true', 'false'), planned
              expected = 'success' if planned == 'true' else 'skipped'
              assert jobs[name]['result'] == expected, name
          PY
